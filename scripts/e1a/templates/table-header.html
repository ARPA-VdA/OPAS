<!DOCTYPE html>
<html>
    <head>
        <style>
            *{
                font-family: arial;
                font-size: 13px;
                margin: 0px;
                padding: 0px;
            }
            body{
                margin: 15px;
            }
            table {
                border-collapse: collapse;
                width: 100%;
            }

            th, td {
                text-align: left;
                padding: 8px;
            }

            tr:nth-child(even){background-color: #f2f2f2}

            th {
                background-color: #4CAF50;
                color: white;
            }
        </style>
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th>Station</th>
                    <th>Code</th>
                    <th>Parameter</th>
                    <th>Data expected</th>
                    <th>Data collected</th>
                    <th>Data coverage (%)</th>
                    <th>Data average</th>
                    <th>Header</th>
                </tr>
            </thead>
